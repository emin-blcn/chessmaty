[package]
name = "chessmaty_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["experimental-threads"] }
shakmaty = { version = "0.30.2", features = ["variant"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
serde_json = "1.0.154"
