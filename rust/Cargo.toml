[package]
name = "chessmaty_rust"
version = "1.0.3"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["experimental-threads"] }
shakmaty = { version = "0.30.2", features = ["variant"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
serde_json = "1.0.154"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
